name: Build Porthole

# A push to main or dev only builds, to prove the code still compiles; the files stay on the run page
# (download them with "gh run download"). Pushing a tag like v1.2.0 builds and publishes a release.
on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        # Tag builds use the tag. Other builds use the last release tag plus "-dev.<run>".
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            # The highest release tag in the repo, even when it sits on a main merge commit that dev does not contain.
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            last="${last:-v0.0.0}"
            v="${last#v}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build signed APK
        env:
          PORTHOLE_KEY: ${{ secrets.PORTHOLE_KEY }}
          PORTHOLE_KEY_PASSWORD: ${{ secrets.PORTHOLE_KEY_PASSWORD }}
          PORTHOLE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "$PORTHOLE_KEY" | base64 -d > porthole.p12
          export PORTHOLE_KEY_ALIAS=$(keytool -list -keystore porthole.p12 -storetype pkcs12 -storepass "$PORTHOLE_KEY_PASSWORD" | grep PrivateKeyEntry | cut -d, -f1)
          gradle assembleRelease
          cp build/outputs/apk/release/*.apk Porthole.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            Porthole.apk

  desktop:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Porthole.exe
        run: dotnet publish desktop/Porthole.csproj -c Release -o out -p:Version=${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: out/Porthole.exe

  release:
    needs: [version, android, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" Porthole.apk Porthole.exe --title "Porthole $VERSION" --generate-notes --latest
