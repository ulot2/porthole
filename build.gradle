plugins {
    id 'com.android.application' version '8.13.0'
}

def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'app.porthole'
    compileSdk 36

    defaultConfig {
        applicationId 'app.porthole'
        minSdk 29
        targetSdk 36
        versionCode build
        versionName System.getenv('PORTHOLE_VERSION') ?: "0.0.0-local"   // set by the GitHub build from the release tag
    }

    // The key comes from GitHub secrets (see .github/workflows/build.yml). A local copy is in keys/.
    signingConfigs {
        release {
            storeFile file('porthole.p12')
            storeType 'pkcs12'
            storePassword System.getenv('PORTHOLE_KEY_PASSWORD')
            keyAlias System.getenv('PORTHOLE_KEY_ALIAS')
            keyPassword System.getenv('PORTHOLE_KEY_PASSWORD')
        }
    }

    buildTypes {
        release { signingConfig signingConfigs.release }
    }

    // The viewer page and its readers, shared with the Windows app.
    sourceSets.main.assets.srcDirs = ['viewer']
}
